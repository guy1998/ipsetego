<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ipsetego">
  <title>ipsetego</title>
  <!--
    The "ip" mark, matching the inline logo in the app headers:
    linear-gradient(135deg, #9c29fb, #6a11cb) behind bold white letters.

    The letters are drawn as geometry rather than <text> on purpose — a favicon
    is rendered outside the page, so no webfont is available to it and a text
    node would fall back to whatever the OS picks.

    Tuned to survive 16x16: the stems and the bowl's counter are deliberately
    heavier and more open than the type would be at display size, so the "p"
    doesn't close up into a blob when scaled down.
  -->
  <defs>
    <linearGradient id="ipsetego-mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c29fb"/>
      <stop offset="1" stop-color="#6a11cb"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#ipsetego-mark-bg)"/>

  <g fill="#fff">
    <!-- i -->
    <circle cx="18.25" cy="18" r="3.75"/>
    <rect x="15" y="25" width="6.5" height="19" rx="3.25"/>
    <!-- p stem, with the descender -->
    <rect x="27.5" y="25" width="6.5" height="25" rx="3.25"/>
  </g>

  <!-- p bowl: a ring, slightly lighter than the stems as bowls normally are -->
  <circle cx="39.5" cy="34.5" r="7.25" fill="none" stroke="#fff" stroke-width="5.5"/>
</svg>
