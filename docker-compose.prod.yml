# Production stack — the images built by .github/workflows/docker-publish.yml.
#
# There is no reverse proxy in here and nothing publishes a port. HTTPS is
# terminated by the one shared Caddy that sits at the server root and fronts
# every app on the box (see caddy/edge/). The three public hostnames are wired
# up in caddy/ipsetego.caddy, which is dropped into that proxy's sites/ folder.
#
#   docker network create edge                       # once per server
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Postgres stays on this project's private network; only the services Caddy has
# to reach also join `edge`.

# Pinned so the project name — and therefore the volume names — don't change if
# the directory is ever renamed or moved.
name: ipsetego

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASS:?DATABASE_PASS must be set in .env}
      POSTGRES_DB: ${DATABASE:-ipsetego}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      # Deliberately not on `edge` — the database is reachable only by backend.
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER:-guy1998}/ipsetego-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${PORT:-1989}"
    networks:
      internal:
      edge:
        # Compose also publishes the bare service name ("backend") as an alias,
        # which every stack on `edge` would collide on. Caddy is pointed at this
        # prefixed alias instead, so the name it resolves is unambiguous. Any new
        # app on the shared network should do the same.
        aliases:
          - ipsetego-backend
    extra_hosts:
      # Lets the container reach an Ollama server running on the host.
      - "host.docker.internal:host-gateway"

  client:
    image: ghcr.io/${GHCR_OWNER:-guy1998}/ipsetego-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      edge:
        aliases:
          - ipsetego-client

  admin-client:
    image: ghcr.io/${GHCR_OWNER:-guy1998}/ipsetego-admin-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      edge:
        aliases:
          - ipsetego-admin

networks:
  # Private to this stack; Compose names it ipsetego_internal.
  internal:
  # Created once on the server with `docker network create edge`, and shared
  # with the Caddy container and every other app it fronts.
  edge:
    external: true

volumes:
  db-data:
