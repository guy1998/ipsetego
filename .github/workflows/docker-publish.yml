name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./Dockerfile
            build_args: ""
          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile
            # Vite inlines VITE_* at build time, so the production API URL has to
            # be baked into the image here. Override with a repository variable
            # (Settings → Secrets and variables → Actions → Variables).
            build_args: VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'https://api.ipsetego.com' }}
          - name: admin-client
            context: ./admin-client
            dockerfile: ./admin-client/Dockerfile
            build_args: VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'https://api.ipsetego.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ipsetego-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
